[project]
name = "claude-roi-calculator"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "MIT"
authors = [
    { name = "Alexander Zwerner and Sebastian Tremblay" }
]
keywords = [""]

dependencies = []

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
claude-roi-calculator = "claude_roi_calculator.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claude_roi_calculator"]

[tool.ruff]
line-length = 100
target-version = "py310"